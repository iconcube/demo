version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/html/ # Amazon Linux의 기본 웹 서버 폴더
    overwrite: yes # 기존 파일이 있으면 덮어쓰기

hooks:
  BeforeInstall:
    - location: scripts/install_server.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root